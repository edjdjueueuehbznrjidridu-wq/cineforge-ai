name: CineForge AI Studio 0.5.0 · Bootstrap, Test and Render

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the exact video idea"
        required: true
        default: "A cinematic short film about a city waking up after a long winter"
        type: string
      duration:
        description: "Duration in seconds (5-600)"
        required: true
        default: "20"
        type: string
      style:
        description: "Visual art direction"
        required: true
        default: "cinematic"
        type: choice
        options: [cinematic, minimal, documentary, motion, cyberpunk, retro, luxury, nature, corporate, dream]
      provider:
        description: "Text director provider"
        required: true
        default: "nestapi"
        type: choice
        options: [nestapi, gemini, local]
      ai_model:
        description: "Model ID"
        required: true
        default: "gpt5"
        type: string
      multi_agent:
        description: "Run three specialist agents"
        required: true
        default: true
        type: boolean
      resolution:
        description: "Output resolution"
        required: true
        default: "720p"
        type: choice
        options: [540p, 720p, 1080p]
      aspect:
        description: "Frame aspect ratio"
        required: true
        default: "9:16"
        type: choice
        options: ["9:16", "16:9", "1:1"]
      fps:
        description: "Frame rate"
        required: true
        default: "24"
        type: choice
        options: ["24", "30", "60"]
      quality:
        description: "H.264 quality profile"
        required: true
        default: "high"
        type: choice
        options: [fast, balanced, high, ultra]
      music:
        description: "Music mood"
        required: true
        default: "auto"
        type: choice
        options: [auto, none, mellow, cinematic, pulse, ambient, hopeful, dark, epic, focus, playful, tension, dreamy, emotional, electronic, documentary]
      music_volume:
        description: "Background score volume (0-40)"
        required: true
        default: 22
        type: number
      music_tempo:
        description: "Music tempo BPM (0 = auto)"
        required: true
        default: 0
        type: number
      visual_engine:
        description: "Scene-image engine"
        required: true
        default: "ensemble"
        type: choice
        options: [ensemble, nano_banana, ai_image_generator, procedural]
      image_quality:
        description: "Image-generation quality"
        required: true
        default: "high"
        type: choice
        options: [standard, high]
      refine_images:
        description: "Run AI image-editing pass"
        required: true
        default: false
        type: boolean
      upscale_images:
        description: "Upscale selected keyframes"
        required: true
        default: true
        type: boolean
      upscale_scale:
        description: "Upscale factor"
        required: true
        default: "2"
        type: choice
        options: ["2", "3", "4"]
      voiceover_text:
        description: "Optional narration text"
        required: false
        default: ""
        type: string
      voiceover_voice:
        description: "NestAPI voice ID"
        required: false
        default: "auto"
        type: string
      allow_procedural_fallback:
        description: "Allow procedural fallback"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cineforge-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-extra unzip

      - name: Extract project ZIP
        run: |
          set -e
          if [ -f app/main.py ] && [ -f web/index.html ]; then
            echo "Sources already exist."
          else
            if [ ! -f CineForge_AI_Studio_v0.5.0.zip ]; then
              echo "ZIP file not found in repository root!"
              ls -la
              exit 1
            fi
            echo "Extracting ZIP..."
            unzip -o CineForge_AI_Studio_v0.5.0.zip -d /tmp/cineforge
            PROJECT_ROOT=$(find /tmp/cineforge -type f -name "main.py" -path "*/app/main.py" | head -1 | xargs dirname | xargs dirname)
            echo "Project root found at: $PROJECT_ROOT"
            cp -a "$PROJECT_ROOT"/. .
            echo "Extraction completed."
            ls -la
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and test
        run: |
          python -m compileall -q app scripts tests
          pytest -q || true
          node --check web/app.js || true

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install CineForge AI Studio 0.5.0 source"
            git push "https://x-access-token:\( {GITHUB_TOKEN}@github.com/ \){GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render production video
        env:
          DEMO_PROMPT: ${{ inputs.prompt }}
          DEMO_DURATION: ${{ inputs.duration }}
          DEMO_STYLE: ${{ inputs.style }}
          DEMO_RESOLUTION: ${{ inputs.resolution }}
          DEMO_PROVIDER: ${{ inputs.provider }}
          DEMO_AI_MODEL: ${{ inputs.ai_model }}
          DEMO_MULTI_AGENT: ${{ inputs.multi_agent }}
          DEMO_ASPECT: ${{ inputs.aspect }}
          DEMO_FPS: ${{ inputs.fps }}
          DEMO_QUALITY: ${{ inputs.quality }}
          DEMO_MUSIC: ${{ inputs.music }}
          DEMO_MUSIC_VOLUME: ${{ inputs.music_volume }}
          DEMO_MUSIC_TEMPO: ${{ inputs.music_tempo }}
          DEMO_VISUAL_ENGINE: ${{ inputs.visual_engine }}
          DEMO_IMAGE_QUALITY: ${{ inputs.image_quality }}
          DEMO_REFINE_IMAGES: ${{ inputs.refine_images }}
          DEMO_UPSCALE_IMAGES: ${{ inputs.upscale_images }}
          DEMO_UPSCALE_SCALE: ${{ inputs.upscale_scale }}
          DEMO_VOICEOVER_TEXT: ${{ inputs.voiceover_text }}
          DEMO_VOICEOVER_VOICE: ${{ inputs.voiceover_voice }}
          DEMO_ALLOW_PROCEDURAL_FALLBACK: ${{ inputs.allow_procedural_fallback }}
        run: python scripts/render_demo.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cineforge-production-${{ github.run_number }}
          path: |
            data/outputs/*.mp4
            data/outputs/*.jpg
            data/outputs/*.json
          if-no-files-found: warn
          retention-days: 14
